version: "3"
services:
  postgres:
    image: library/postgres:13
    container_name: postgres
    restart: on-failure
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/:/docker-entrypoint-initdb.d/
    ports:
      - "5432:5432"

  flight-service:
    build:
      context: ./v1
      dockerfile: FlightService/Dockerfile
    container_name: flight-service
    restart: on-failure
    ports:
      - "8060:8060"
    depends_on:
      - postgres

  bonus-service:
    build:
      context: ./v1
      dockerfile: BonusService/Dockerfile
    container_name: bonus-service
    restart: on-failure
    ports:
      - "8050:8050"
    depends_on:
      - postgres

  ticket-service:
    build:
      context: ./v1
      dockerfile: TicketService/Dockerfile
    container_name: ticket-service
    restart: on-failure
    ports:
      - "8070:8070"
    depends_on:
      - postgres

  gateway:
    build:
      context: ./v1
      dockerfile: GatewayService/Dockerfile
    container_name: gateway
    restart: on-failure
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - flight-service
      - bonus-service
      - ticket-service

volumes:
  db-data:
